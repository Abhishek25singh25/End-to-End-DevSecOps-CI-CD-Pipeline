name: Docker Build and Push

on:
  workflow_call:
    inputs:
      image_name:
        type: string
        required: true
    secrets:
      DOCKER_USERNAME:
        required: true
      DOCKER_TOKEN:
        required: true
    outputs:
      image_url:
        value: ${{ jobs.docker.outputs.image_url }}

jobs:
  docker:
    runs-on: ubuntu-latest

    outputs:
      image_url: ${{ steps.set-output.outputs.image_url }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build Docker Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/${{ inputs.image_name }}:${{ github.sha }} .

      - name: Tag as Latest
        run: |
          docker tag ${{ secrets.DOCKER_USERNAME }}/${{ inputs.image_name }}:${{ github.sha }} \
          ${{ secrets.DOCKER_USERNAME }}/${{ inputs.image_name }}:latest

      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/${{ inputs.image_name }}:${{ github.sha }}
          docker push ${{ secrets.DOCKER_USERNAME }}/${{ inputs.image_name }}:latest

      - name: Set Image Output
        id: set-output
        run: |
          echo "image_url=${{ secrets.DOCKER_USERNAME }}/${{ inputs.image_name }}:${{ github.sha }}" >> $GITHUB_OUTPUT