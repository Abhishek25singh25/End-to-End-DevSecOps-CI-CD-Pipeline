name: Docker Build and Push

on:
  workflow_call:
    inputs:
      image_name:
        type: string
        required: true
    secrets:
      DOCKER_USERNAME:
        required: true
      DOCKER_TOKEN:
        required: true
    outputs:
      image_url:
        value: ${{ jobs.docker.outputs.image_url }}

jobs:
  docker:
    runs-on: ubuntu-latest

    outputs:
      image_url: ${{ steps.set-output.outputs.image_url }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Docker Login
        run: echo "${{ secrets.DOCKER_TOKEN }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build Docker Image
        run: docker build -t "${{ secrets.DOCKER_USERNAME }}/task-manager:${{ github.sha }}" .

      - name: Tag Latest
        run: docker tag "${{ secrets.DOCKER_USERNAME }}/task-manager:${{ github.sha }}" "${{ secrets.DOCKER_USERNAME }}/task-manager:latest"

      - name: Push Images
        run: |
          docker push "${{ secrets.DOCKER_USERNAME }}/task-manager:${{ github.sha }}"
          docker push "${{ secrets.DOCKER_USERNAME }}/task-manager:latest"

      - name: Set Output
        id: set-output
        run: echo "image_url=${{ secrets.DOCKER_USERNAME }}/task-manager:${{ github.sha }}" >> $GITHUB_OUTPUT