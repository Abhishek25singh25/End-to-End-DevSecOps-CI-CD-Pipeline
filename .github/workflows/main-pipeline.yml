name: Main Pipeline

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    uses: ./.github/workflows/build-test.yml

  docker:
    needs: build-test
    uses: ./.github/workflows/docker-build-push.yml
    with:
      image_name: task-manager
    secrets: inherit

  scan:
    needs: docker
    runs-on: ubuntu-latest

    steps:
      - name: Run Trivy Scan
        uses: aquasecurity/trivy-action@v0.20.0
        with:
          image-ref: ${{ secrets.DOCKER_USERNAME }}/task-manager:${{ github.sha }}
          format: table
          exit-code: 0
          severity: CRITICAL,HIGH

  deploy:
    needs: [docker, scan]
    runs-on: ubuntu-latest

    steps:
      - name: Deploy Step
        run: |
          echo Deploying image: ${{ needs.docker.outputs.image_url }}