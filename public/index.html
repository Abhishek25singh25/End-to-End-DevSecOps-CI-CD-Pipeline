<!DOCTYPE html>
<html>
<head>
    <title>Task Manager</title>
    <style>
        body { font-family: Arial; background: #0f172a; color: white; text-align: center; }
        .container { width: 400px; margin: auto; background: #1e293b; padding: 20px; border-radius: 10px; }
        input { padding: 10px; width: 70%; }
        button { padding: 10px; background: green; color: white; border: none; }
        li { background: #334155; margin: 10px; padding: 10px; display: flex; justify-content: space-between; }
        .done { text-decoration: line-through; }
    </style>
</head>
<body>

<h1>🚀 Task Manager</h1>

<div class="container">
    <input id="taskInput" placeholder="Enter task">
    <button onclick="addTask()">Add</button>
    <ul id="taskList"></ul>
</div>

<script>
async function fetchTasks() {
    const res = await fetch("/tasks");
    const data = await res.json();

    const list = document.getElementById("taskList");
    list.innerHTML = "";

    data.forEach(task => {
        const li = document.createElement("li");
        li.innerHTML = `
            <span class="${task.completed ? 'done' : ''}">${task.title}</span>
            <button onclick="completeTask(${task.id})">✔</button>
        `;
        list.appendChild(li);
    });
}

async function addTask() {
    const title = document.getElementById("taskInput").value;
    if (!title) return;

    await fetch("/tasks", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ title })
    });

    document.getElementById("taskInput").value = "";
    fetchTasks();
}

async function completeTask(id) {
    await fetch(`/tasks/${id}`, { method: "PUT" });
    fetchTasks();
}

fetchTasks();
</script>

</body>
</html>
